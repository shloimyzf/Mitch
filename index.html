<!DOCTYPE html>
<html lang="en" style="color-scheme: light;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mitch's Coffee</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#E2CB9F">

  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <script type="text/javascript">
    (function(){ emailjs.init("X_5xpqldnPZM4GwJh"); })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    :root { color-scheme: light; }
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; background-color: #E2CB9F; color: #432818; }
    .animate-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .menu-card { aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; position: relative; overflow: hidden; }
    .menu-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(226, 203, 159, 1) 0%, rgba(226, 203, 159, 0.7) 35%, rgba(0,0,0,0) 100%); z-index: 1; }
    .btn-disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
  </style>
</head>
<body class="select-none pb-32">

<div id="main-view">
  <div class="min-h-screen flex flex-col items-center justify-center gap-4">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-[#432818]"></div>
    <p class="text-[#432818] text-sm font-black uppercase tracking-widest">Brewing...</p>
  </div>
</div>

<div id="modal-layer" class="fixed inset-0 z-50 pointer-events-none flex items-end sm:items-center justify-center"></div>
<div id="toast-layer" class="fixed top-4 left-4 right-4 z-[60] pointer-events-none"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

  const firebaseConfig = { apiKey: "AIzaSyCMcxuH-8Pc0t8eC71xOU8TXLu0ZoF-RG4", authDomain: "mitches-coffee.firebaseapp.com", projectId: "mitches-coffee", storageBucket: "mitches-coffee.firebasestorage.app", messagingSenderId: "789709713646", appId: "1:789709713646:web:3f09ce026b40a85b3f03ff" };
  const VAPID_KEY = "BF3iJzRgdcJq3LAFW2cO5_5m-dGyzGhS74-_G4ty6O9lzftV92_inFFBP9ThuDAZ7FJd2V27VvNFgJsyOk8lzg4";
  const appId = "mitchs-coffee";
  const EMAIL_SERVICE_ID = "service_m3qf2td"; const EMAIL_TEMPLATE_ID = "template_c7bbquk"; const ADMIN_CONTACTS = ["Rybdpm@gmail.com"];
  
  let db, auth, messaging, deferredPrompt;
  let MENU_ITEMS = [];
  let CATEGORIES = [];
  let state = {
    user: null, deviceId: null, isLoggedIn: false, customerName: "", customerEmail: "", dormRoom: "", orders: [], cart: [], isDelivery: true,
    settings: { deliveryEnabled: true, shopOpen: true, outOfStock: [] },
    modal: { isOpen: false, item: null, size: null, syrup: null, pumps: 0, milk: 'Regular' },
    showInstall: false, fcmToken: null, myTab: 0
  };

  async function init() {
    setupIdentity();
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; state.showInstall = true; renderMain(); });
    
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app); auth = getAuth(app); messaging = getMessaging(app);

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    await signInAnonymously(auth);
    onAuthStateChanged(auth, user => {
      state.user = user;
      if (user) { 
          listenMenu();
          listenOrders(); 
          listenSettings(); 
          if(Notification.permission === 'granted') requestPushPermission(true); 
      }
    });

    onMessage(messaging, (payload) => { showToast(`🔔 ${payload.notification.title}: ${payload.notification.body}`); });
    setInterval(() => { if(state.isLoggedIn) renderMain(); }, 15000); 
  }

  function listenMenu() {
    onSnapshot(collection(db, "artifacts", appId, "public", "data", "menu"), snap => {
        MENU_ITEMS = snap.docs.map(d => ({ dbId: d.id, ...d.data() }));
        CATEGORIES = [...new Set(MENU_ITEMS.map(i => i.category || 'Food'))];
        renderMain();
    });
  }

  window.requestPushPermission = async (silent = false) => {
    try {
        if (!silent) {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') return showToast("Permission Denied");
        }
        const registration = await navigator.serviceWorker.getRegistration();
        const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
        if (token) { state.fcmToken = token; if(!silent) showToast("Notifications Enabled! ✅"); renderMain(); } 
    } catch (err) { if(!silent) alert("TECHNICAL ERROR:\n" + err.message); }
  };

  function setupIdentity() {
    let storedId = localStorage.getItem('mitch_device_id');
    if (!storedId) { storedId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('mitch_device_id', storedId); }
    state.deviceId = storedId;
    const storedName = localStorage.getItem('mitch_customer_name');
    const storedEmail = localStorage.getItem('mitch_customer_email');
    if (storedName && storedEmail) { state.customerName = storedName; state.customerEmail = storedEmail; state.isLoggedIn = true; }
  }

  // LIVE LEDGER TAB CALCULATION
  function listenOrders() {
    onSnapshot(collection(db, "artifacts", appId, "public", "data", "orders"), snap => {
      const allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.orders = allOrders.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
      
      let tabTotal = 0;
      allOrders.forEach(o => {
          if (o.customerName && state.customerName && o.customerName.toLowerCase().trim() === state.customerName.toLowerCase().trim()) {
              if (!o.paid && o.status !== 'cancelled') {
                  tabTotal += (o.total || 0);
              }
          }
      });
      state.myTab = tabTotal;
      renderMain();
    });
  }

  function listenSettings() {
      onSnapshot(doc(db, "artifacts", appId, "public", "data", "settings", "global"), (docSnap) => {
          if (docSnap.exists()) {
              state.settings = { outOfStock: [], ...docSnap.data() };
              if (!state.settings.deliveryEnabled && state.isDelivery) { state.isDelivery = false; state.dormRoom = ""; }
              renderMain();
          }
      });
  }

  window.installPwa = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') state.showInstall = false; deferredPrompt = null; renderMain(); };

  window.getPrice = (itemId, size, milk) => {
    const item = MENU_ITEMS.find(i => i.id === itemId || i.dbId === itemId);
    if (!item) return 0;
    
    let base = 0;
    if (item.type === 'drink') {
        base = size === 'Small' ? parseFloat(item.priceSmall || 0) : parseFloat(item.priceLarge || 0);
    } else {
        base = parseFloat(item.priceBase || item.priceLarge || 0);
    }
    if (milk === 'Oat') base += 1.00;
    return base;
  }

  window.login = e => { e.preventDefault(); const name = document.getElementById("loginName").value.trim(); const email = document.getElementById("loginEmail").value.trim(); if (!name || !email) return alert("Name and Email Required!"); state.customerName = name; state.customerEmail = email; state.isLoggedIn = true; localStorage.setItem('mitch_customer_name', name); localStorage.setItem('mitch_customer_email', email); requestPushPermission(); renderMain(); };
  window.logout = () => { localStorage.clear(); location.reload(); };
  window.updateRoom = (val) => { state.dormRoom = val; };
  window.setDelivery = v => { state.isDelivery = v; if(!v) state.dormRoom = ""; renderMain(); };
  window.cancelOrder = async (id) => { if(!confirm("Cancel this order?")) return; try { await deleteDoc(doc(db, "artifacts", appId, "public", "data", "orders", id)); showToast("Order Cancelled"); } catch(e) { console.error(e); } };

  window.openModal = (id) => {
      if (!state.settings.shopOpen) return showToast("Shop is Closed!");
      const item = MENU_ITEMS.find(i => i.id === id || i.dbId === id);
      if (!item) return;

      let size = 'Large'; 
      let milk = 'Regular';
      let syrup = item.defaultSyrup || 'None'; 
      let pumps = item.defaultPumps || 0;

      state.modal = { isOpen: true, item, size, syrup, pumps, milk };
      renderModal();
  };

  window.closeModal = () => { state.modal.isOpen = false; renderModal(); setTimeout(() => { state.modal.item = null; }, 200); };
  
  window.updateModalState = (key, value) => {
      state.modal[key] = value;
      if (key === 'syrup' && value === 'None') state.modal.pumps = 0;
      renderModal();
  };

  window.changeModalPumps = (d) => { state.modal.pumps = Math.max(0, Math.min(10, state.modal.pumps + d)); renderModal(); };

  window.addToCartFromModal = () => {
      const { item, size, syrup, pumps, milk } = state.modal;
      const itemId = item.dbId || item.id;
      const price = getPrice(itemId, size, milk);
      
      const existing = state.cart.find(c => c.id === itemId && c.size === size && c.syrupType === syrup && c.syrupPumps === pumps && c.milk === milk);
      if (existing) {
          existing.qty++; 
      } else { 
          state.cart.push({ ...item, id: itemId, size, price, syrupType: syrup, syrupPumps: pumps, milk, qty: 1 });
      }
      
      state.modal.isOpen = false; 
      renderModal(); 
      renderMain(); 
  };

  window.removeCart = idx => { if (state.cart[idx].qty > 1) state.cart[idx].qty--; else state.cart.splice(idx, 1); renderMain(); };
  window.addCartQty = idx => { state.cart[idx].qty++; renderMain(); };

  window.order = async () => {
    if (!state.cart.length) return showToast("Cart is empty!");
    if (state.isDelivery && !state.dormRoom) return showToast("Room # required for Delivery!");
    sendTextToAdmin(state.customerName, state.dormRoom);
    try {
      await addDoc(collection(db, "artifacts", appId, "public", "data", "orders"), {
        customerName: state.customerName, customerEmail: state.customerEmail, dormRoom: state.dormRoom, 
        items: state.cart, total: state.cart.reduce((s, i) => s + (i.price * i.qty), 0), isDelivery: state.isDelivery, 
        status: "pending", paid: false, timestamp: serverTimestamp(), userId: state.user.uid, deviceId: state.deviceId, fcmToken: state.fcmToken 
      });
      state.cart = []; state.isDelivery = true; state.dormRoom = ""; 
      showToast("Order Sent!"); renderMain();
    } catch(e) { showToast("Error sending order!"); }
  };
  
  function sendTextToAdmin(name, room) { emailjs.send(EMAIL_SERVICE_ID, EMAIL_TEMPLATE_ID, { to_email: ADMIN_CONTACTS[0], name: name, email: "noreply@mitchscoffee.com", message: `NEW ORDER: ${name} ${room ? 'in Room ' + room : '(Pickup)'}` }); }
  function showToast(m) { const t = document.getElementById("toast-layer"); t.innerHTML = `<div class="animate-bounce bg-[#432818] text-[#E2CB9F] px-6 py-3 rounded-2xl shadow-2xl text-center font-bold border border-[#E2CB9F]/20 mx-auto max-w-xs">${m}</div>`; setTimeout(() => { t.innerHTML = ''; }, 3000); }

  function renderMain() {
    const root = document.getElementById("main-view");
    if(state.modal.isOpen) return;

    if (!state.isLoggedIn) {
        root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white/90 backdrop-blur w-full max-w-sm rounded-3xl p-8 shadow-2xl text-center space-y-6 animate-in">
                <div class="bg-[#432818] w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-lg border-4 border-[#E2CB9F]"><img src="image.png" class="w-16 h-16 rounded-full shadow-sm"></div>
                <h1 class="text-4xl font-black text-[#432818] tracking-tight italic">Mitch's Coffee</h1>
                <form onsubmit="login(event)" class="space-y-4 text-left">
                    <input required id="loginName" placeholder="Name" class="w-full bg-[#E2CB9F]/30 border-2 border-[#432818]/20 rounded-2xl px-6 py-4 text-lg outline-none focus:border-[#432818] font-bold text-[#432818] placeholder-[#432818]/50">
                    <input type="email" required id="loginEmail" placeholder="Email (Required)" class="w-full bg-[#E2CB9F]/30 border-2 border-[#432818]/20 rounded-2xl px-6 py-4 text-lg outline-none focus:border-[#432818] font-bold text-[#432818] placeholder-[#432818]/50">
                    <button class="w-full bg-[#432818] text-[#E2CB9F] py-4 rounded-2xl font-bold text-xl shadow-xl active:scale-95 transition-transform uppercase tracking-wider">Start Ordering</button>
                </form>
            </div>
        </div>`;
    } else {
        const now = Date.now();
        const myOrders = state.orders.filter(o => o.deviceId === state.deviceId && o.status !== 'completed' && (now - (o.timestamp?.toMillis() || now) < 3600000));
        
        root.innerHTML = `
            ${state.showInstall ? `<div class="bg-[#432818] text-[#E2CB9F] p-3 flex justify-between items-center sticky top-0 z-50 shadow-md animate-in"><div class="flex items-center gap-3"><img src="icon.png" class="w-8 h-8 rounded-lg bg-white p-0.5"><div><p class="text-xs font-bold">Install App</p></div></div><button onclick="installPwa()" class="bg-[#E2CB9F] text-[#432818] px-3 py-1 rounded-full text-xs font-black uppercase shadow-lg">Install</button></div>` : ''}
            
            <header class="bg-[#E2CB9F]/90 backdrop-blur-md border-b border-[#432818]/10 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-3"><img src="image.png" class="w-12 h-12 rounded-full"><h1 class="text-2xl font-black italic text-[#432818] tracking-tighter">Mitch's Coffee</h1></div>
                <div class="flex flex-col items-end gap-1">
                    <div class="bg-[#432818] text-[#E2CB9F] px-3 py-1 rounded-full text-xs font-black tracking-widest uppercase shadow-md flex items-center gap-1"><i data-lucide="wallet" class="w-3 h-3"></i> Tab: $${state.myTab.toFixed(2)}</div>
                    <button onclick="logout()" class="text-[10px] font-bold text-[#432818] opacity-60 hover:opacity-100 uppercase underline">Log Out</button>
                </div>
            </header>

            <main class="max-w-md mx-auto p-4 space-y-6 pb-32">
                ${!state.settings.shopOpen ? `<div class="bg-[#432818] text-[#E2CB9F] p-6 rounded-3xl text-center space-y-4 shadow-xl border-4 border-red-500 animate-in"><h2 class="text-3xl font-black italic">Closed!</h2><p class="text-[#E2CB9F]/70 font-bold">Mitch is away right now.</p></div>` : ''}
                
                <button onclick="requestPushPermission()" class="w-full py-2 bg-[#432818]/10 text-[#432818] font-bold uppercase text-[10px] rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform"><i data-lucide="bell" class="w-3 h-3"></i> ${state.fcmToken ? 'Notifications Active' : 'Enable Notifications'}</button>

                ${myOrders.map(o => `
                    <section class="bg-white p-6 rounded-[2.5rem] shadow-xl border-4 ${o.status==='ready'?'border-green-500':'border-[#432818]/20'} space-y-5 animate-in relative overflow-hidden">
                        <div class="flex justify-between items-center relative z-10"><h3 class="font-black text-sm uppercase flex items-center gap-2 tracking-widest text-[#432818]">${o.status==='ready' ? '<i data-lucide="check-circle" class="text-green-500"></i> READY!' : '<i data-lucide="zap" class="animate-pulse text-[#432818]"></i> ' + o.status.toUpperCase()}</h3><div class="flex gap-2 items-center">${o.status === 'pending' ? `<button onclick="cancelOrder('${o.id}')" class="bg-red-100 text-red-600 px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider hover:bg-red-200">Cancel</button>` : ''}<span class="text-[10px] font-black bg-[#E2CB9F] text-[#432818] px-2 py-1 rounded">#${o.id.slice(-4)}</span></div></div>
                        <div class="flex justify-between items-center bg-[#E2CB9F]/20 p-4 rounded-2xl border border-[#432818]/10"><span class="text-2xl font-black uppercase italic text-[#432818] tracking-tighter">${o.status}</span></div>
                        <div class="relative h-6 rounded-full bg-[#E2CB9F]/50 overflow-hidden shadow-inner"><div class="h-full transition-all duration-1000 ${o.status==='ready'?'bg-green-500':'bg-[#432818]'}" style="width: ${o.status==='pending'?'20%':o.status==='brewing'?'60%':'100%'}"></div></div>
                        <div class="bg-[#E2CB9F]/20 rounded-2xl p-4 space-y-2 border border-[#432818]/10 text-xs">${o.items.map(it => `<div class="flex justify-between font-black text-[#432818]"><span>${it.qty}x ${it.name}</span><span class="opacity-60 text-right">${it.size || ''} ${it.milk && it.milk !== 'Regular' ? `(${it.milk})` : ''} ${it.syrupType!=='None' && it.syrupType ? `<br><span class="text-[10px]">${it.syrupPumps}p ${it.syrupType}</span>` : ''}</span></div>`).join('')}</div>
                    </section>`).join('')}

                ${state.cart.length ? `
                    <section class="bg-[#432818] text-[#E2CB9F] p-6 rounded-3xl shadow-2xl space-y-5">
                        <h2 class="text-xl font-black flex items-center gap-2 text-[#E2CB9F]"><i data-lucide="shopping-bag" class="w-6 h-6"></i> Basket</h2>
                        ${state.settings.deliveryEnabled ? `<div class="grid grid-cols-2 gap-2 bg-[#E2CB9F]/10 p-1 rounded-2xl border border-[#E2CB9F]/20"><button onclick="setDelivery(false)" class="py-4 rounded-xl text-[10px] font-black uppercase transition-all ${!state.isDelivery ? 'bg-[#E2CB9F] text-[#432818] shadow-lg' : 'text-[#E2CB9F]/50'}">Pickup</button><button onclick="setDelivery(true)" class="py-4 rounded-xl text-[10px] font-black uppercase transition-all ${state.isDelivery ? 'bg-[#E2CB9F] text-[#432818] shadow-lg' : 'text-[#E2CB9F]/50'}">Delivery (Free)</button></div>` : '<div class="text-center text-xs font-bold uppercase opacity-50">Pickup Only</div>'}
                        <div class="space-y-3 px-1">${state.cart.map((cartItem, idx) => `<div class="flex items-center justify-between text-sm"><div class="flex flex-col"><span class="font-bold">${cartItem.qty}x ${cartItem.name}</span><span class="text-[10px] opacity-70 font-bold uppercase">${cartItem.size || ''} ${cartItem.syrupType!=='None' && cartItem.syrupType ? `(${cartItem.syrupPumps}p ${cartItem.syrupType})` : ''} ${cartItem.milk && cartItem.milk !== 'Regular' ? `(${cartItem.milk})` : ''}</span></div><div class="flex items-center gap-2"><button onclick="removeCart(${idx})" class="p-1 bg-[#E2CB9F]/20 rounded-lg"><i data-lucide="minus" class="w-3 h-3"></i></button><button onclick="addCartQty(${idx})" class="p-1 bg-[#E2CB9F] text-[#432818] rounded-lg"><i data-lucide="plus" class="w-3 h-3"></i></button><span class="font-bold ml-2">$${(cartItem.price*cartItem.qty).toFixed(2)}</span></div></div>`).join('')}</div>
                        ${state.isDelivery ? `<input oninput="updateRoom(this.value)" value="${state.dormRoom}" placeholder="Room # (Required)" class="w-full bg-[#E2CB9F]/10 border-none rounded-2xl px-5 py-4 text-[#E2CB9F] font-black placeholder-[#E2CB9F]/50 outline-none focus:ring-2 focus:ring-[#E2CB9F]/50">` : ''}
                        <button onclick="order()" class="w-full bg-[#E2CB9F] text-[#432818] py-4 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-transform">Order • $${(state.cart.reduce((s, i) => s + (i.price * i.qty), 0)).toFixed(2)}</button>
                    </section>` : ''}

                ${CATEGORIES.map(cat => `
                    <section class="space-y-4">
                        <h2 class="text-2xl font-black border-b-4 border-[#432818]/20 pb-2 uppercase tracking-tight italic text-[#432818]">${cat}</h2>
                        <div class="menu-grid">
                            ${MENU_ITEMS.filter(i => (i.category || 'Food') === cat).map(item => {
                                const isOutOfStock = state.settings.outOfStock && state.settings.outOfStock.includes(item.id || item.dbId);
                                let priceDisplay = ''; 
                                if (item.type === 'drink') priceDisplay = `$${parseFloat(item.priceSmall||0).toFixed(2)} / $${parseFloat(item.priceLarge||0).toFixed(2)}`;
                                else priceDisplay = `$${parseFloat(item.priceBase||item.priceLarge||0).toFixed(2)}`;
                                
                                return `
                                <button onclick="${isOutOfStock ? '' : `openModal('${item.id || item.dbId}')`}" class="${isOutOfStock ? 'opacity-50 grayscale cursor-not-allowed' : 'active:scale-[0.95] hover:shadow-xl'} bg-[#432818] rounded-[1.5rem] border shadow-md p-4 menu-card transition group text-left relative overflow-hidden" style="background-image: url('${item.image || 'cookie.png'}');">
                                    <div class="flex flex-col items-start gap-1 z-10 w-full h-full justify-between">
                                        <div>
                                            <h3 class="font-black text-[#432818] text-lg leading-tight drop-shadow-md mb-1">${item.name}</h3>
                                            ${item.notes ? `<span class="text-[9px] font-bold bg-[#E2CB9F] text-[#432818] px-1 py-0.5 rounded uppercase leading-none shadow-sm">${item.notes}</span>` : ''}
                                        </div>
                                        <div class="flex w-full justify-between items-end mt-2">
                                            <div class="text-[#432818] font-black bg-[#E2CB9F]/90 px-3 py-2 rounded-xl text-[10px] backdrop-blur-md shadow-sm">${isOutOfStock ? 'SOLD OUT' : priceDisplay}</div>
                                            <div class="bg-[#E2CB9F]/90 p-2 rounded-full backdrop-blur-md shadow-sm"><i data-lucide="${isOutOfStock ? 'ban' : 'plus'}" class="w-5 h-5 text-[#432818]"></i></div>
                                        </div>
                                    </div>
                                </button>`;
                            }).join('')}
                        </div>
                    </section>`).join('')}
            </main>`;
        lucide.createIcons();
    }
  }

  function renderModal() {
      const container = document.getElementById("modal-layer");
      const { isOpen, item, size, syrup, pumps, milk } = state.modal;
      if (!isOpen || !item) { container.innerHTML = ''; container.style.pointerEvents = 'none'; return; }
      container.style.pointerEvents = 'auto';
      
      const isDrink = item.type === 'drink';
      const hasSyrups = isDrink && item.syrups && item.syrups.length > 0;

      container.innerHTML = `
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div id="modal-card" class="bg-[#E2CB9F] text-[#432818] w-full max-w-sm rounded-t-[2rem] sm:rounded-[2rem] p-6 relative z-10 shadow-2xl space-y-6 pb-10 modal-enter">
            <div class="flex justify-between items-start">
                <div><h2 class="text-3xl font-black leading-tight italic">${item.name}</h2><p id="modal-price" class="opacity-60 font-bold text-lg">$${getPrice(item.dbId || item.id, size, milk).toFixed(2)}</p></div>
                <button onclick="closeModal()" class="bg-[#432818]/10 p-2 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            ${isDrink ? `
                <div class="space-y-4">
                     <div><label class="text-xs font-black opacity-50 uppercase ml-1">Size</label><div class="bg-[#432818]/10 p-1 rounded-2xl flex mt-1"><button onclick="updateModalState('size', 'Small')" class="flex-1 py-4 rounded-xl text-sm font-black transition-all ${size==='Small'?'bg-[#432818] text-[#E2CB9F] shadow-lg':'opacity-50'}">Small</button><button onclick="updateModalState('size', 'Large')" class="flex-1 py-4 rounded-xl text-sm font-black transition-all ${size==='Large'?'bg-[#432818] text-[#E2CB9F] shadow-lg':'opacity-50'}">Large</button></div></div>
                     
                     ${hasSyrups ? `
                     <div>
                         <label class="text-xs font-black opacity-50 uppercase ml-1">Flavor</label>
                         <div class="bg-[#432818]/10 p-1 rounded-2xl flex flex-wrap gap-1 mt-1">
                             ${['None', ...item.syrups].map(s => `
                                <button onclick="updateModalState('syrup', '${s}')" class="flex-1 min-w-[30%] py-3 rounded-xl text-xs font-black transition-all ${syrup===s?'bg-[#432818] text-[#E2CB9F] shadow-lg':'opacity-50'}">${s}</button>
                             `).join('')}
                         </div>
                     </div>
                     ${syrup && syrup !== 'None' ? `
                     <div class="animate-in" id="pumps-container">
                         <label class="text-xs font-black opacity-50 uppercase ml-1">Pumps</label>
                         <div class="flex items-center justify-between bg-[#432818]/5 border-2 border-[#432818]/10 p-2 rounded-2xl mt-1">
                             <button onclick="changeModalPumps(-1)" class="w-12 h-12 bg-[#E2CB9F] rounded-xl shadow-sm border border-[#432818]/20 flex items-center justify-center"><i data-lucide="minus" class="w-5 h-5 opacity-50"></i></button>
                             <span id="modal-pumps" class="font-black text-3xl">${pumps}</span>
                             <button onclick="changeModalPumps(1)" class="w-12 h-12 bg-[#432818] text-[#E2CB9F] rounded-xl shadow-lg flex items-center justify-center"><i data-lucide="plus" class="w-5 h-5"></i></button>
                         </div>
                     </div>` : ''}` : ''}

                    <div><label class="text-xs font-black opacity-50 uppercase ml-1">Milk</label><div class="bg-[#432818]/10 p-1 rounded-2xl flex mt-1"><button onclick="updateModalState('milk', 'Regular')" class="flex-1 py-4 rounded-xl text-sm font-black transition-all ${milk==='Regular'?'bg-[#432818] text-[#E2CB9F] shadow-lg':'opacity-50'}">Regular</button><button onclick="updateModalState('milk', 'Oat')" class="flex-1 py-4 rounded-xl text-sm font-black transition-all ${milk==='Oat'?'bg-[#432818] text-[#E2CB9F] shadow-lg':'opacity-50'}">Oat (+$1)</button></div></div>
                </div>` : ''}
            <button onclick="addToCartFromModal()" class="w-full bg-[#432818] text-[#E2CB9F] py-5 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all">Add to Order</button>
        </div>`;
      lucide.createIcons();
  }

  init();
</script>
</body>
</html>
